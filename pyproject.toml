[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectermap"
version = "0.1.0"
description = "Local attack surface mapping and OSINT correlation dashboard"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.20,<1", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "networkx>=3.3,<4", "jinja2>=3.1.6,<4", "packaging>=24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["spectermap*"]

[tool.setuptools.package-data]
spectermap = ["templates/*.html", "static/*", "data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
